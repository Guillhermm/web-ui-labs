<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>The Navier-Stokes Vortex, by Guilherme Zeni</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="viewer">
    <div class="stage">
      <canvas tabindex="0" aria-label="Animated vortex: streamlines spiral inward around a vertical axis and stretch along it, spinning faster near the core. Drag or use the arrow keys to orbit, R to reset the view."></canvas>
      <span class="note note-below" data-anchor="-0.95,-0.05,0.3" aria-hidden="true">inward spiral</span>
      <span class="note note-right" data-anchor="0,1.36,0" aria-hidden="true">axial stretching</span>
      <div class="tooltip" aria-hidden="true">
        <strong class="tooltip-title"></strong>
        <span class="tooltip-text"></span>
        <span class="tooltip-stats"></span>
      </div>
    </div>

    <div class="controls">
      <div class="legend" tabindex="0" role="group" aria-label="Spin rate legend: hover it, or focus it and use the arrow keys, to highlight the streamlines spinning at that rate">
        <span class="control-title">Spin rate <span class="control-note">hover to highlight</span></span>
        <div class="legend-bar"><span class="legend-band"></span></div>
        <span class="control-scale" aria-hidden="true"><span>outer rim</span><span>core</span></span>
      </div>
      <label class="speed">
        <span class="control-title">Playback <output class="speed-value">1×</output></span>
        <input type="range" min="0" max="3" step="0.25" value="1">
        <span class="control-scale" aria-hidden="true"><span>paused</span><span>3×</span></span>
      </label>
      <div class="singularity">
        <span class="control-title">Singularity</span>
        <button type="button" class="blowup">
          <span class="blowup-fill" aria-hidden="true"></span>
          <svg class="blowup-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a1 1 0 1 1 2 0a3 3 0 1 1-6 0a5 5 0 1 1 10 0a7 7 0 1 1-14 0" />
          </svg>
          <span>Run to blowup</span>
        </button>
        <span class="control-scale blowup-status" aria-live="polite">the core collapses at T*</span>
      </div>
    </div>
    <p class="hint"></p>
  </main>
</body>

</html>
